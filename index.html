<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indie Developer Task Manager</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>Indie Task Board</h1><p>Plan features, track bugs, and ship milestones.</p></div><button id="export">Export JSON</button></header><section class="panel"><h2>New task</h2><form class="controls" id="entry"><label>Task<input name="title" maxlength="120" placeholder="Fix collision issue" required></label><label>Type<select name="type"><option>Feature</option><option>Bug</option><option>Polish</option></select></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><button>Add task</button></form></section><div class="grid" id="board"></div><footer>Open-source demo • Runs locally in your browser</footer><script src="app.js"></script></main></body></html>
